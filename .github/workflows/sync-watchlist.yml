name: Sync watchlist requests

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync-watchlist:
    if: startsWith(github.event.issue.title, '[VietStockLab Watchlist]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply watchlist request
        id: update
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            const match = title.match(/^\[VietStockLab Watchlist\]\s+(ADD|REMOVE)\s+([A-Z0-9]{2,6})$/);
            if (!match) {
              core.setFailed('Issue title must be: [VietStockLab Watchlist] ADD TICKER or REMOVE TICKER');
              return;
            }
            const [, action, symbol] = match;
            const fs = require('fs');
            const path = 'data/symbols.json';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            const before = config.stocks.length;
            if (action === 'ADD') {
              if (!config.stocks.includes(symbol)) config.stocks.push(symbol);
            } else {
              config.stocks = config.stocks.filter(s => s !== symbol);
            }
            config.stocks = [...new Set(config.stocks)].sort();
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
            core.setOutput('changed', String(before !== config.stocks.length || action === 'ADD' && !config.stocks.includes(symbol)));
            core.setOutput('symbol', symbol);
            core.setOutput('action', action);

      - name: Commit synchronized watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/symbols.json
          if git diff --cached --quiet; then
            echo "Watchlist already in requested state."
          else
            git commit -m "Sync watchlist request from issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Trigger market data refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run refresh-market-data.yml --ref main

      - name: Close request issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: 'Đã xử lý yêu cầu watchlist. Quy trình cập nhật dữ liệu thị trường đã được kích hoạt.'
            });
            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
