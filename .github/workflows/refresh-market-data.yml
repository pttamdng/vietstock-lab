name: Refresh Vietnam market data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install data library
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://vnstocks.com/api/packages "vnstock==5.2.0"

      - name: Set Fixed Machine ID for Vnstock
        run: |
          # Khởi tạo machine-id cố định để tránh lỗi vượt quá số thiết bị trên Vnstock
          echo "9f7b3240a2a14e3b8a1c5d6e7f8a9b0c" | sudo tee /etc/machine-id
          echo "9f7b3240a2a14e3b8a1c5d6e7f8a9b0c" | sudo tee /var/lib/dbus/machine-id

      - name: Fetch daily OHLCV
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python scripts/refresh_market_data.py

      - name: Commit updated data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "Update daily market data"
            git push
          fi
