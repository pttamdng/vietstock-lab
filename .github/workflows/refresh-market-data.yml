
name: Refresh Vietnam market data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install data library
      
       run: python -m pip install --upgrade pip && python -m pip install --extra-index-url https://vnstocks.com/api/packages "vnstock==5.0.1"

      - name: Fetch daily OHLCV
        run: python scripts/refresh_market_data.py

      - name: Commit updated data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "Update daily market data"
            git push
          fi
