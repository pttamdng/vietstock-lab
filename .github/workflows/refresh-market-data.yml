name: Refresh Vietnam market data (CafeF)

on:
  workflow_dispatch:
  schedule:
    # 17:15 Vietnam time, Monday-Friday (UTC+7 = 10:15 UTC)
    - cron: "15 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh-market-data-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch one year of OHLCV directly from CafeF
        run: python scripts/refresh_market_data.py

      - name: Commit updated market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json

          if git diff --cached --quiet; then
            echo "No market data changes to commit."
            exit 0
          fi

          git commit -m "Update CafeF market data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
