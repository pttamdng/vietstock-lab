name: Refresh Vietnam market data (CafeF + DNSE/Vietcap indices)

on:
  workflow_dispatch:
  schedule:
    # 17:15 Vietnam time, Monday-Friday (UTC+7 = 10:15 UTC)
    - cron: "15 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh-market-data-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free index data provider
        run: python -m pip install "vn-market-data @ git+https://github.com/ternlabs/vn-market-data@v0.4.1"

      - name: Fetch two years of OHLCV
        env:
          VN_MARKET_DATA_DB: ${{ runner.temp }}/vn_market_data.sqlite
        run: python scripts/refresh_market_data.py

      - name: Commit updated market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json

          if git diff --cached --quiet; then
            echo "No market data changes to commit."
            exit 0
          fi

          git commit -m "Update Vietnam market data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
